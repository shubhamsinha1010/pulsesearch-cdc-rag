name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the only job that needs more (docker) raises it
# for itself.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  # ghcr.io/<owner>/<repo>/<component>
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  lint-python:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install tooling
        run: pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check services scripts
      - name: Ruff format check
        run: ruff format --check services scripts

  security-python:
    name: Security (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/**/requirements.txt
            services/common/pyproject.toml
      - name: Install tooling + service deps for audit
        run: |
          pip install -r requirements-dev.txt
          pip install "./services/common"
          pip install -r services/api/requirements.txt
          pip install -r services/worker/requirements.txt
          pip install -r services/ingest/requirements.txt
      - name: Bandit
        run: bandit -c bandit.yaml -r services --severity-level medium
      - name: pip-audit
        # Advisory: known transitive CVEs should not block merges while still visible in CI.
        continue-on-error: true
        run: |
          pip-audit -r services/api/requirements.txt
          pip-audit -r services/worker/requirements.txt
          pip-audit -r services/ingest/requirements.txt
          pip-audit ./services/common

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [lint-python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install common + test deps
        run: |
          python -m pip install -U pip
          pip install "./services/common"
          pip install -r services/api/requirements.txt
          pip install -r services/worker/requirements.txt
          pip install -r services/ingest/requirements.txt
          pip install -r requirements-dev.txt
      - name: Run unit tests
        run: make test
        env:
          HF_HUB_DISABLE_PROGRESS_BARS: "1"

  smoke-es:
    name: ES upsert → BM25 smoke
    runs-on: ubuntu-latest
    needs: [lint-python]
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            services/common/pyproject.toml
      - name: Install common + pytest
        run: |
          python -m pip install -U pip
          pip install "./services/common" -r requirements-dev.txt
      - name: Run ES smoke
        run: make smoke
        env:
          ES_URL: http://localhost:9200
          ES_INDEX: pages_ci_smoke

  lint-web:
    name: Lint + build (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint (next lint)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000

  validate-configs:
    name: Validate configs (YAML/JSON + Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install tooling
        run: pip install -r requirements-dev.txt
      - name: Parse every YAML/JSON config
        run: make validate-configs
      - name: Validate Compose schema
        run: docker compose config --quiet

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and later removed is
          # still leaked, so scanning only the tip would miss it.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
      - name: Scan commit history
        run: gitleaks git . --no-banner --redact --verbose

  k8s-validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl + kubeconform
        run: |
          curl -sSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/$(curl -sSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl
          curl -sSL -o /tmp/kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tgz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/
      - name: Render and validate
        run: |
          kubectl kustomize deploy/k8s/base > /tmp/base.yaml
          kubectl kustomize deploy/k8s/overlays/local-kind > /tmp/local-kind.yaml
          kubectl kustomize deploy/k8s/overlays/ghcr > /tmp/ghcr.yaml
          kubeconform -summary -ignore-missing-schemas /tmp/base.yaml
          kubeconform -summary -ignore-missing-schemas /tmp/local-kind.yaml
          kubeconform -summary -ignore-missing-schemas /tmp/ghcr.yaml

  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs:
      - lint-python
      - test
      - smoke-es
      - lint-web
      - k8s-validate
      - security-python
      - validate-configs
      - secret-scan
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: services/api/Dockerfile
            context: .
          - name: worker
            dockerfile: services/worker/Dockerfile
            context: .
          - name: ingest
            dockerfile: services/ingest/Dockerfile
            context: .
          - name: web
            dockerfile: web/Dockerfile
            context: web
            # Match Ingress hosts in deploy/k8s/base/ingress.yaml
            build-args: |
              NEXT_PUBLIC_API_URL=http://api.pulsesearch.local
              NEXT_PUBLIC_WS_URL=ws://api.pulsesearch.local
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' }}
            type=raw,value=ci,enable=${{ env.PUBLISH != 'true' }}
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Single stable status to point branch protection at, so the required-checks
  # list does not have to be edited every time a job is added or a matrix leg
  # changes. `always()` plus an explicit result check is required — without it
  # this job would be skipped (and reported as success) when a dependency fails.
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint-python
      - security-python
      - test
      - smoke-es
      - lint-web
      - validate-configs
      - secret-scan
      - k8s-validate
      - docker
    steps:
      - name: Check job results
        run: |
          echo "${{ toJSON(needs) }}"
          if echo "${{ join(needs.*.result, ' ') }}" | grep -qE 'failure|cancelled'; then
            echo "One or more required jobs did not pass."
            exit 1
          fi
          echo "All required jobs passed."
