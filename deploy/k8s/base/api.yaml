apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: pulsesearch
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: pulsesearch
spec:
  # replicas is intentionally unset: the HorizontalPodAutoscaler in hpa.yaml
  # owns it, and re-applying a hardcoded value would fight the autoscaler.
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: pulsesearch
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: pulsesearch
      # Uvicorn finishes in-flight requests; WebSocket clients get time to drain.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: pulsesearch-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: pulsesearch-config
            - secretRef:
                name: pulsesearch-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Not read-only: sentence-transformers writes lock files into the
            # baked HF cache (HF_HOME=/opt/hf) on first model load.
            readOnlyRootFilesystem: false
          # Importing torch + sentence-transformers takes tens of seconds. The
          # startupProbe absorbs that, so liveness/readiness can stay tight
          # without a long initialDelaySeconds masking real hangs later.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # /health/ready returns 503 when Elasticsearch is unreachable, so a
          # pod that cannot serve search is pulled from the Service.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: pulsesearch
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: pulsesearch
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: http
