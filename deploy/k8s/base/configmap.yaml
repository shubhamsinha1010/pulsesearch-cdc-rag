apiVersion: v1
kind: ConfigMap
metadata:
  name: pulsesearch-config
  namespace: pulsesearch
  labels:
    app.kubernetes.io/part-of: pulsesearch
data:
  # In-cluster DNS when MySQL / Redpanda / ES also run in the cluster.
  # For local kind + Compose infra, use the local-kind overlay instead.
  MYSQL_HOST: mysql
  MYSQL_DATABASE: pulsesearch
  MYSQL_USER: pulse
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  KAFKA_SOURCE_TOPIC: pulse.pulsesearch.pages
  KAFKA_GROUP_ID: pulsesearch-sync
  # Poison messages land here; see docs/runbooks/dead-letter-queue.md.
  KAFKA_DLQ_TOPIC: pulsesearch.dlq
  ES_URL: http://elasticsearch:9200
  ES_INDEX: pages
  EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
  EMBEDDING_DIMENSIONS: "384"
  INGEST_SOURCE: wikimedia
  INGEST_WIKIS: enwiki
  SUMMARY_ENRICHMENT: "true"
  SUMMARY_ENRICHMENT_WORKERS: "2"
  SUMMARY_FETCH_CONCURRENCY: "8"
  GROQ_MODEL: llama-3.1-8b-instant
  LOG_LEVEL: INFO
  LOG_JSON: "true"
  METRICS_PORT: "9100"
