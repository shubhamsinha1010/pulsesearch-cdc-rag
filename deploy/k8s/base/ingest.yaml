apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: pulsesearch
  labels:
    app.kubernetes.io/name: ingest
    app.kubernetes.io/part-of: pulsesearch
spec:
  # Must stay at 1. The Wikimedia SSE firehose has no consumer-group semantics,
  # so a second replica would duplicate every event into MySQL and double the
  # CDC volume. Deliberately not autoscaled.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest
  strategy:
    # Recreate for the same reason: a rolling update would briefly run two
    # firehose readers.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingest
        app.kubernetes.io/part-of: pulsesearch
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: pulsesearch
      # SIGTERM breaks the stream loop and flushes the pending batch to MySQL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        # Only writable path needed once the root filesystem is read-only.
        - name: tmp
          emptyDir: {}
      containers:
        - name: ingest
          image: pulsesearch-ingest:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: pulsesearch-config
            - secretRef:
                name: pulsesearch-secrets
          env:
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # No ML libraries here, so the stricter setting is safe.
            readOnlyRootFilesystem: true
          # No readinessProbe: nothing routes traffic to ingest (see worker.yaml).
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# ClusterIP for metrics scraping only (see deploy/k8s/optional/servicemonitor.yaml).
apiVersion: v1
kind: Service
metadata:
  name: ingest
  namespace: pulsesearch
  labels:
    app.kubernetes.io/name: ingest
    app.kubernetes.io/part-of: pulsesearch
spec:
  selector:
    app.kubernetes.io/name: ingest
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
