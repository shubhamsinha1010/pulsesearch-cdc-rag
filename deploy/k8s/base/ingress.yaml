# Host-based Ingress for the app tier.
# Requires an Ingress controller (e.g. ingress-nginx). See deploy/k8s/README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulsesearch
  namespace: pulsesearch
  labels:
    app.kubernetes.io/part-of: pulsesearch
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: pulsesearch.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
    - host: api.pulsesearch.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
