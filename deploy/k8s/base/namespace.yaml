apiVersion: v1
kind: Namespace
metadata:
  name: pulsesearch
  labels:
    app.kubernetes.io/part-of: pulsesearch
    # Pod Security Admission: every workload here runs non-root with all
    # capabilities dropped, so the strictest built-in profile is enforced
    # rather than merely audited. This is what keeps the securityContext
    # blocks in the Deployments honest.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
