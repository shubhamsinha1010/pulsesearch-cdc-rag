apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pulsesearch
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: pulsesearch
spec:
  # Managed by the HorizontalPodAutoscaler in hpa.yaml.
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: pulsesearch
    spec:
      serviceAccountName: pulsesearch
      terminationGracePeriodSeconds: 30
      # NEXT_PUBLIC_* values are inlined into the client bundle at build time,
      # so this pod needs no config or secrets at runtime.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: pulsesearch-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Next.js writes into .next/cache at runtime.
            readOnlyRootFilesystem: false
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: pulsesearch
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: pulsesearch
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 3000
      targetPort: http
