apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: pulsesearch
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: pulsesearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: pulsesearch
    spec:
      serviceAccountName: pulsesearch
      containers:
        - name: web
          image: pulsesearch-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: pulsesearch
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: pulsesearch
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 3000
      targetPort: http
