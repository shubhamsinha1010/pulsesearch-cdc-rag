apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: pulsesearch
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: pulsesearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: pulsesearch
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: pulsesearch
      containers:
        - name: worker
          image: pulsesearch-worker:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: pulsesearch-config
            - secretRef:
                name: pulsesearch-secrets
          # Metrics HTTP server is started after process boot; use it as a probe.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
