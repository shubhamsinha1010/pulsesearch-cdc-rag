apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: pulsesearch
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: pulsesearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: pulsesearch
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      containers:
        - name: worker
          image: pulsesearch-worker:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: pulsesearch-config
            - secretRef:
                name: pulsesearch-secrets
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
