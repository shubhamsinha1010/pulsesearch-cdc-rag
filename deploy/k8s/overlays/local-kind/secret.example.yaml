# Copy to secret.yaml (gitignored) or create with:
#   kubectl -n pulsesearch create secret generic pulsesearch-secrets \
#     --from-literal=MYSQL_PASSWORD=pulse \
#     --from-literal=GROQ_API_KEY=your_key
apiVersion: v1
kind: Secret
metadata:
  name: pulsesearch-secrets
  namespace: pulsesearch
type: Opaque
stringData:
  MYSQL_PASSWORD: pulse
  GROQ_API_KEY: ""
