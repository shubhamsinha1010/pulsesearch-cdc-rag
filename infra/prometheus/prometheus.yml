global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]
        labels:
          service: worker

  - job_name: ingest
    static_configs:
      - targets: ["ingest:9100"]
        labels:
          service: ingest

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
        labels:
          service: redpanda
